site_name: agent-skills
site_url: https://gautampachnanda101.github.io/agent-skills/
site_description: Reusable skills for coding assistants, including a Backstage catalog builder
repo_url: https://github.com/gautampachnanda101/agent-skills
repo_name: gautampachnanda101/agent-skills
nav:
  - Home: index.md
  - Skills:
      - Overview: skills/index.md
      - backstage-catalog-builder: skills/backstage-catalog-builder.md
      - peer-code-review: skills/peer-code-review.md
      - documentation-review: skills/documentation-review.md
      - documentation-author: skills/documentation-author.md
      - skill-correction: skills/skill-correction.md
      - decision-record-author: skills/decision-record-author.md
      - specification-author: skills/specification-author.md
      - specification-review: skills/specification-review.md
      - test-plan-author: skills/test-plan-author.md
      - security-review: skills/security-review.md
      - change-plan-author: skills/change-plan-author.md
      - release-notes-author: skills/release-notes-author.md
  - Getting started:
      - Installing the skills: installation.md
      - Using the skills: usage.md
  - Verification: verification.md
  - Make rules hard: hard-rules.md
  - Local Backstage: local-backstage.md
  - Contributing a skill: contributing.md
  - Plan: plan.md
  - Decisions:
      - Overview: decisions/index.md
      - 0001 Record decisions: decisions/0001-record-decisions.md
      - 0002 Answer-key evals: decisions/0002-grade-skill-replies-with-answer-keys.md
      - 0003 Local model in CI: decisions/0003-small-local-model-in-ci.md
      - 0004 Pinning: decisions/0004-pin-everything-by-digest-or-commit.md
      - 0005 Releases: decisions/0005-a-person-publishes-releases.md
      - 0006 Skill names: decisions/0006-skill-names.md
      - 0007 Protecting main: decisions/0007-protect-main-without-requiring-pull-requests.md
      - 0008 Behaviour evals: decisions/0008-contract-based-behaviour-evals.md
      - 0009 Hard rules: decisions/0009-enforce-rules-outside-the-model.md
      - Template: decisions/template.md
theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - techdocs-core
