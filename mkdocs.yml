site_name: agent-skills
site_description: Reusable skills for coding assistants, including a Backstage catalog builder
site_url: https://gautampachnanda101.github.io/agent-skills/
repo_name: gautampachnanda101/agent-skills
repo_url: https://github.com/gautampachnanda101/agent-skills
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Skills:
      - Overview: skills/index.md
      - backstage-catalog-builder: skills/backstage-catalog-builder.md
      - peer-code-review: skills/peer-code-review.md
      - documentation-review: skills/documentation-review.md
  - Getting started:
      - Installing the skills: installation.md
      - Using the skills: usage.md
  - Verification: verification.md
  - Contributing a skill: contributing.md

theme:
  name: material
  # Matches https://gautampachnanda101.github.io/homebrew-tap/
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - techdocs-core
  # Runs after techdocs-core, which resets the theme palette unconditionally.
  - palette-restore
