theme:
  name: material
  # mkdocs-techdocs-core resets the palette and features; docs/hooks/theme.py
  # restores them, matching the Homebrew Tap site.
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: fontawesome/solid/sun
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: fontawesome/solid/moon
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - techdocs-core
  - search

# Runs after the plugins, so it can put back the palette and features that
# techdocs-core resets. A hook needs no install, so Backstage runs it too.
hooks:
  - docs/hooks/theme.py

extra_css:
  - stylesheets/extra.css
