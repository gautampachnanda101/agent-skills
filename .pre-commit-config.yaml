repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: repository-tests
        name: Make and installer regression tests
        entry: node scripts/pre-commit-tests.cjs
        language: system
        pass_filenames: false
        files: '^(Makefile|scripts/|tests/|\.githooks/|\.pre-commit-config\.yaml)'
