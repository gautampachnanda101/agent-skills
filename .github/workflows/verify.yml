name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pre-commit, tests, and skill smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The repository test suite requires Node 24.15+; '24' resolves to the
      # latest 24.x release on the runner.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Validate pre-commit configuration
        run: pre-commit validate-config .pre-commit-config.yaml

      # Includes the YAML/JSON/lint hooks and the Make/installer regression tests
      # (node scripts/pre-commit-tests.cjs).
      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run skill smoke checks
        run: make skill-smoke COLOR=never

  techdocs-public:
    name: TechDocs checker on public repositories
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check this repository's TechDocs site
        run: node backstage-catalog-builder/scripts/check-techdocs.mjs --root . --strict catalog-info.yaml

      # Runs the MkDocs/TechDocs checker against a pinned public repository so
      # real-world YAML conventions (deeply nested nav, quoted values, plugin
      # maps) are exercised in CI. Bump the tag deliberately: a new tag may add
      # pages or change the site shape, which the checker will report.
      - name: Sample a pinned public TechDocs repository
        run: |
          git clone --depth 1 --filter=blob:none --branch v1.49.7 \
            --single-branch --sparse \
            https://github.com/backstage/backstage.git "$RUNNER_TEMP/backstage"
          git -C "$RUNNER_TEMP/backstage" sparse-checkout set --skip-checks \
            catalog-info.yaml mkdocs.yml docs
          node backstage-catalog-builder/scripts/check-techdocs.mjs \
            --root "$RUNNER_TEMP/backstage" --strict \
            "$RUNNER_TEMP/backstage/catalog-info.yaml"

  skill-llm:
    name: Local model applies the skill
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # llama.cpp CPU binary (~23 MB) plus the ~400 MB quantized model; the
      # restore keeps later runs to a few minutes of compute.
      - name: Cache llama.cpp and model
        uses: actions/cache@v4
        with:
          path: .llm-cache
          key: skill-llm-b12681-qwen2.5-0.5b-v1

      - name: Verify the skill with a local model
        run: make skill-llm-verify
