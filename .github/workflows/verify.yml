name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pre-commit, tests, and skill smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The version check compares against the previous commit.
          fetch-depth: 0

      # The repository test suite requires Node 24.15+; '24' resolves to the
      # latest 24.x release on the runner.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Cache pre-commit environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Validate pre-commit configuration
        run: pre-commit validate-config .pre-commit-config.yaml

      # Includes the YAML/JSON/lint hooks and the Make/installer regression tests
      # (node scripts/pre-commit-tests.cjs).
      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run skill smoke checks
        run: make skill-smoke COLOR=never

      # A changed skill must raise its version and update the changelog.
      # Pull requests compare with their base; pushes with the previous head.
      - name: Check versions against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-versions.mjs --base "${BASE:-HEAD~1}"

  secrets:
    name: Secret scan of the full history
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The same gitleaks release as the pre-commit hook, checked against
      # its published SHA-256. Reviewed false positives are listed by
      # fingerprint in .gitleaksignore.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  techdocs-public:
    name: TechDocs checker on public repositories
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check this repository's TechDocs site
        run: node skills/backstage-catalog-builder/scripts/check-techdocs.mjs --root . --strict catalog-info.yaml

      # Runs the MkDocs/TechDocs checker against a pinned public repository so
      # real-world YAML conventions (deeply nested nav, quoted values, plugin
      # maps) are exercised in CI. Bump the tag deliberately: a new tag may add
      # pages or change the site shape, which the checker will report.
      - name: Sample a pinned public TechDocs repository
        run: |
          git clone --depth 1 --filter=blob:none --branch v1.49.7 \
            --single-branch --sparse \
            https://github.com/backstage/backstage.git "$RUNNER_TEMP/backstage"
          git -C "$RUNNER_TEMP/backstage" sparse-checkout set --skip-checks \
            catalog-info.yaml mkdocs.yml docs
          node skills/backstage-catalog-builder/scripts/check-techdocs.mjs \
            --root "$RUNNER_TEMP/backstage" --strict \
            "$RUNNER_TEMP/backstage/catalog-info.yaml"

      # Second pinned sample: real-world monorepo MkDocs fixtures (custom
      # docs_dir in included sites, quoted !include values, bare subnav
      # pages). The fixtures target the monorepo plugin alone, so a
      # techdocs-core plugin line and a synthetic entity descriptor are added
      # by the check; site_name is taken from each fixture so the entity name
      # still matches.
      - name: Sample public monorepo MkDocs examples
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/backstage/mkdocs-monorepo-plugin.git "$RUNNER_TEMP/mmp"
          git -C "$RUNNER_TEMP/mmp" fetch --depth 1 origin f62ae22e387c1cb2ef358a0a74926400d3d8021f
          git -C "$RUNNER_TEMP/mmp" checkout FETCH_HEAD
          for fixture in ok-different-docs-dir ok-git-authors-plugin; do
            dir="$RUNNER_TEMP/mmp/__tests__/integration/fixtures/$fixture"
            for site in "$dir/mkdocs.yml" "$dir"/*/mkdocs.yml; do
              [ -f "$site" ] || continue
              node -e 'const fs=require("fs");const p=process.argv[1];let t=fs.readFileSync(p,"utf8");if(!/^  - techdocs-core$/m.test(t))t=t.replace(/^plugins:\s*$/m,"plugins:\n  - techdocs-core");fs.writeFileSync(p,t)' "$site"
            done
            site_name=$(node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8");const m=t.match(/^\s*site_name:\s*["'"'"']?(.*?)["'"'"']?\s*$/m);process.stdout.write(m?m[1]:"")' "$dir/mkdocs.yml")
            [ -n "$site_name" ] || { echo "No site_name found in $fixture" >&2; exit 1; }
            printf 'apiVersion: backstage.io/v1alpha1\nkind: Component\nmetadata:\n  name: %s\n  annotations:\n    backstage.io/techdocs-ref: dir:./\nspec:\n  type: library\n  lifecycle: experimental\n  owner: group:default/catalog-test\n' "$site_name" > "$dir/catalog-info.yaml"
            node skills/backstage-catalog-builder/scripts/check-techdocs.mjs "$dir/catalog-info.yaml"
          done

  skill-llm:
    name: Local model applies the skill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 and arm64, macOS arm64 and Intel: every pinned archive.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      # llama.cpp binary (~20 MB) plus the ~490 MB quantized model; the
      # restore keeps later runs to a few minutes of compute. The key hashes
      # the script that pins the build, model, and checksums, so changing a
      # pin starts a fresh cache.
      - name: Cache llama.cpp and model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .llm-cache
          key: skill-llm-${{ matrix.os }}-${{ hashFiles('skills/backstage-catalog-builder/scripts/skill-llm-verify.sh') }}

      - name: Verify the skill with a local model
        run: make skill-llm-verify

  plugin-manifest:
    name: Claude plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The Claude Code CLI validates .claude-plugin/plugin.json and
      # marketplace.json; --strict turns manifest warnings into failures.
      # Pinned so a new CLI release cannot fail CI without a change here;
      # bump it deliberately.
      - name: Install the Claude Code CLI
        # An exact version stands in for a lockfile for this one global CLI.
        run: npm install -g @anthropic-ai/claude-code@2.1.332 # zizmor: ignore[adhoc-packages]

      - name: Validate the plugin and marketplace manifests
        run: claude plugin validate --strict .
