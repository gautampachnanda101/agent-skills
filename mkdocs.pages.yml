# The GitHub Pages build of the docs site, matching the theme of
# https://gautampachnanda101.github.io/homebrew-tap/. It inherits mkdocs.yml,
# which Backstage TechDocs reads and which must list only techdocs-core.
INHERIT: mkdocs.yml

theme:
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - techdocs-core
  # Runs after techdocs-core, which resets the theme palette and features.
  - palette-restore
  - search
